<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homes of Sanctuary — Guest &amp; Operations Portal</title>
    <meta
      name="description"
      content="Sign in to your Homes of Sanctuary stay: booking details, payments, dining, requests and more at our private villas."
    />
    <!-- Fonts load from here, not a CSS @import, and without blocking the first
         paint: text shows in the fallback face and swaps when the font lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- The sign-in photo is the largest paint; fetch it before the JS asks for it. -->
    <link rel="preload" as="image" href="/loginbg.webp" type="image/webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
